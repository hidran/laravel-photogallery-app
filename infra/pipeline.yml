AWSTemplateFormatVersion: '2010-09-09'
Description: PhotoGallery Pro — CodePipeline (GitHub source → CodeBuild → ECS rolling deploy + S3)

Parameters:
  AppStackName:
    Type: String
    Default: photogallery-production
    Description: Name of the main app CloudFormation stack (provides VPC IDs, ECS cluster, etc.)

  GitHubOwner:
    Type: String
    Description: GitHub username or org

  GitHubRepo:
    Type: String
    Description: GitHub repository name

  GitHubBranch:
    Type: String
    Default: main

  CodeStarConnectionArn:
    Type: String
    Description: |
      ARN of the CodeStar Connection (previously CodeStar Source Connection).
      Create one in the console: Developer Tools → Settings → Connections → Create.
      Initial state will be PENDING — must be authorized via the GitHub App
      install flow before the pipeline can run.

Resources:
  # ============================================================
  # Pipeline artifact bucket
  # ============================================================
  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      BucketName: !Sub photogallery-${AWS::AccountId}-pipeline-artifacts
      LifecycleConfiguration:
        Rules:
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
      VersioningConfiguration:
        Status: Suspended
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  # ============================================================
  # IAM roles
  # ============================================================
  CodeBuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: codebuild.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/CloudWatchLogsFullAccess
      Policies:
        - PolicyName: BuildPermissions
          PolicyDocument:
            Statement:
              # Pipeline artifacts
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:GetBucketLocation]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*

              # ECR push
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: '*'

              # Frontend deploy: S3 sync + CloudFront invalidation
              - Effect: Allow
                Action: [s3:ListBucket, s3:GetObject, s3:PutObject, s3:DeleteObject]
                Resource:
                  - !Sub arn:aws:s3:::photogallery-production-frontend-${AWS::AccountId}
                  - !Sub arn:aws:s3:::photogallery-production-frontend-${AWS::AccountId}/*
              - Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: '*'

              # Migration step: run-task on ECS, read task description, read logs
              - Effect: Allow
                Action:
                  - ecs:RunTask
                  - ecs:DescribeTasks
                  - ecs:DescribeTaskDefinition
                  - ecs:ListTasks
                Resource: '*'
              - Effect: Allow
                Action: iam:PassRole
                Resource: '*'
                Condition:
                  StringEquals:
                    iam:PassedToService: ecs-tasks.amazonaws.com
              - Effect: Allow
                Action: logs:GetLogEvents
                Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/ecs/photogallery-*:*

  CodePipelineRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: codepipeline.amazonaws.com }
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelinePermissions
          PolicyDocument:
            Statement:
              - Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:GetBucketLocation, s3:ListBucket]
                Resource:
                  - !GetAtt ArtifactBucket.Arn
                  - !Sub ${ArtifactBucket.Arn}/*

              - Effect: Allow
                Action:
                  - codebuild:BatchGetBuilds
                  - codebuild:StartBuild
                Resource: '*'

              - Effect: Allow
                Action: codestar-connections:UseConnection
                Resource: !Ref CodeStarConnectionArn

              # CloudFormation deploy action
              - Effect: Allow
                Action:
                  - cloudformation:CreateChangeSet
                  - cloudformation:DeleteChangeSet
                  - cloudformation:DescribeChangeSet
                  - cloudformation:ExecuteChangeSet
                  - cloudformation:DescribeStacks
                  - cloudformation:DescribeStackEvents
                  - cloudformation:GetTemplate
                  - cloudformation:GetTemplateSummary
                  - cloudformation:SetStackPolicy
                  - cloudformation:UpdateStack
                  - cloudformation:ValidateTemplate
                Resource:
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}/*
                  - !Sub arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AppStackName}-*/*

              # PassRole to the CloudFormation execution role
              - Effect: Allow
                Action: iam:PassRole
                Resource: !GetAtt CloudFormationExecutionRole.Arn
                Condition:
                  StringEquals:
                    iam:PassedToService: cloudformation.amazonaws.com

  # CloudFormation assumes this role to actually create/modify resources.
  # Broad permissions because the app stack covers VPC, RDS, ECS, IAM, etc.
  CloudFormationExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudformation.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        # In a stricter setup, replace this with a scoped-down policy
        # that only covers the resource types in cloudformation.yml.
        # AdministratorAccess is the simplest correct choice for a
        # solo-account deploy.
        - arn:aws:iam::aws:policy/AdministratorAccess

  # ============================================================
  # CodeBuild projects
  # ============================================================
  BackendBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppStackName}-backend-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        PrivilegedMode: true  # required for docker build
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: ECR_REGISTRY
            Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com
          - Name: ECR_REPOSITORY
            Value: !Ref AppStackName
      Source:
        Type: CODEPIPELINE
        BuildSpec: backend/buildspec.yml
      TimeoutInMinutes: 20

  FrontendBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppStackName}-frontend-build
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: VITE_API_BASE_URL
            Value:
              Fn::ImportValue: !Sub ${AppStackName}-APIURL
          - Name: FRONTEND_BUCKET
            Value:
              Fn::ImportValue: !Sub ${AppStackName}-FrontendBucketName
          - Name: CLOUDFRONT_DISTRIBUTION_ID
            Value:
              Fn::ImportValue: !Sub ${AppStackName}-CloudFrontDistributionId
      Source:
        Type: CODEPIPELINE
        BuildSpec: frontend/buildspec.yml
      TimeoutInMinutes: 10

  MigrateBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AppStackName}-migrate
      ServiceRole: !GetAtt CodeBuildRole.Arn
      Artifacts:
        Type: CODEPIPELINE
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/amazonlinux2-x86_64-standard:5.0
        EnvironmentVariables:
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
          - Name: ECS_CLUSTER
            Value: !Ref AppStackName
          - Name: ECS_TASK_DEFINITION
            Value: !Ref AppStackName
          - Name: PUBLIC_SUBNET_A
            Value:
              Fn::ImportValue: !Sub ${AppStackName}-PublicSubnetA
          - Name: PUBLIC_SUBNET_B
            Value:
              Fn::ImportValue: !Sub ${AppStackName}-PublicSubnetB
          - Name: ECS_SECURITY_GROUP
            Value:
              Fn::ImportValue: !Sub ${AppStackName}-ECSSecurityGroup
      Source:
        Type: CODEPIPELINE
        BuildSpec: backend/buildspec-migrate.yml
      TimeoutInMinutes: 10

  # ============================================================
  # Pipeline
  # ============================================================
  Pipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Ref AppStackName
      RoleArn: !GetAtt CodePipelineRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref ArtifactBucket
      Stages:
        # ----------------------------------------------------
        # Source: GitHub via CodeStar Connection
        # ----------------------------------------------------
        - Name: Source
          Actions:
            - Name: GitHub
              ActionTypeId:
                Category: Source
                Owner: AWS
                Provider: CodeStarSourceConnection
                Version: '1'
              Configuration:
                ConnectionArn: !Ref CodeStarConnectionArn
                FullRepositoryId: !Sub ${GitHubOwner}/${GitHubRepo}
                BranchName: !Ref GitHubBranch
                DetectChanges: 'true'
              OutputArtifacts:
                - Name: SourceArtifact

        # ----------------------------------------------------
        # Build: backend image push + frontend build (parallel)
        # ----------------------------------------------------
        - Name: Build
          Actions:
            - Name: BackendImage
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref BackendBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              OutputArtifacts:
                - Name: BackendBuildOutput
              RunOrder: 1

            - Name: FrontendBuild
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref FrontendBuildProject
              InputArtifacts:
                - Name: SourceArtifact
              RunOrder: 1

        # ----------------------------------------------------
        # Migrate: run before deploy so schema is ready
        # ----------------------------------------------------
        - Name: Migrate
          Actions:
            - Name: RunMigrations
              ActionTypeId:
                Category: Build
                Owner: AWS
                Provider: CodeBuild
                Version: '1'
              Configuration:
                ProjectName: !Ref MigrateBuildProject
              InputArtifacts:
                - Name: SourceArtifact

        # ----------------------------------------------------
        # DeployInfra: apply template changes AND new image in one step
        #
        # Uses a CloudFormation deploy action driven by:
        #   - SourceArtifact (provides infra/cloudformation.yml)
        #   - BackendBuildOutput (provides image-uri.json)
        #
        # Parameters NOT in ParameterOverrides keep their previous value
        # (this is how we inherit DBPassword, AppKey, AdminPassword
        # without putting them in the pipeline). ContainerImage is set
        # to the just-built image via Fn::GetParam.
        # ----------------------------------------------------
        - Name: DeployInfra
          Actions:
            - Name: UpdateStack
              ActionTypeId:
                Category: Deploy
                Owner: AWS
                Provider: CloudFormation
                Version: '1'
              Configuration:
                ActionMode: CREATE_UPDATE
                StackName: !Ref AppStackName
                Capabilities: CAPABILITY_IAM
                RoleArn: !GetAtt CloudFormationExecutionRole.Arn
                TemplatePath: SourceArtifact::infra/cloudformation.yml
                ParameterOverrides: !Sub |
                  {
                    "Environment": "production",
                    "ContainerImage": {
                      "Fn::GetParam": ["BackendBuildOutput", "image-uri.json", "ImageURI"]
                    }
                  }
              InputArtifacts:
                - Name: SourceArtifact
                - Name: BackendBuildOutput
              RunOrder: 1

Outputs:
  PipelineUrl:
    Description: CodePipeline console URL
    Value: !Sub https://${AWS::Region}.console.aws.amazon.com/codesuite/codepipeline/pipelines/${Pipeline}/view?region=${AWS::Region}

  ArtifactBucketName:
    Value: !Ref ArtifactBucket
