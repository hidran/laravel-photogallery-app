version: 0.2

# CodeBuild spec for running Laravel migrations as a one-shot ECS task.
# Runs after the new image is pushed to ECR but before ECS rolls out the
# new task definition. This way migrations land before any new app
# instance tries to query the DB with the new schema.

phases:
  build:
    commands:
      - echo "Running migrations against the live RDS instance..."
      - |
        TASK_ARN=$(aws ecs run-task \
          --region "$AWS_DEFAULT_REGION" \
          --cluster "$ECS_CLUSTER" \
          --task-definition "$ECS_TASK_DEFINITION" \
          --launch-type FARGATE \
          --network-configuration "awsvpcConfiguration={subnets=[$PUBLIC_SUBNET_A,$PUBLIC_SUBNET_B],securityGroups=[$ECS_SECURITY_GROUP],assignPublicIp=ENABLED}" \
          --overrides '{"containerOverrides":[{"name":"app","command":["php","artisan","migrate","--force"]}]}' \
          --started-by "codepipeline-migrate" \
          --query 'tasks[0].taskArn' \
          --output text)
      - echo "Migration task ARN $TASK_ARN"
      - aws ecs wait tasks-stopped --region "$AWS_DEFAULT_REGION" --cluster "$ECS_CLUSTER" --tasks "$TASK_ARN"
      - |
        EXIT_CODE=$(aws ecs describe-tasks \
          --region "$AWS_DEFAULT_REGION" \
          --cluster "$ECS_CLUSTER" \
          --tasks "$TASK_ARN" \
          --query 'tasks[0].containers[0].exitCode' \
          --output text)
      - echo "Migration exit code $EXIT_CODE"
      - |
        if [ "$EXIT_CODE" != "0" ]; then
          echo "Migration failed. Tail of task logs:"
          TASK_ID=$(echo "$TASK_ARN" | awk -F/ '{print $NF}')
          aws logs get-log-events \
            --region "$AWS_DEFAULT_REGION" \
            --log-group-name "/ecs/$ECS_CLUSTER" \
            --log-stream-name "app/app/$TASK_ID" \
            --query 'events[*].message' \
            --output text | tail -50 || true
          exit 1
        fi
